name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: verifier (proven bounds)
        run: npm run verify
      - name: red-team corpus (zero escapes)
        run: npm run attack
      - name: bench harness (claim integrity)
        run: npm run bench
      - name: vm bench (metering cost)
        run: npm run bench:vm
      - name: build
        run: npx vite build
